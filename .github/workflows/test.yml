name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit suites
        run: |
          python test_audit_common.py
          python test_claude_cache_audit.py
          python test_orientation_profile.py
          python test_demo_history.py
      - name: Self-tests
        run: |
          python lane_profile.py --selftest
          python compact_economics.py --selftest
          python tool_bloat.py --selftest
          python orientation_profile.py selftest
          python session_ledger.py selftest
